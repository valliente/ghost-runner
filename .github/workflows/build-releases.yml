name: Build & Release Ghost Runner

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Run automated tests
        run: npm test

      - name: Build Web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android Release / Debug APK
        run: |
          cd android
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../GhostRunner-v1.101.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghost-runner-android-apk
          path: GhostRunner-v1.101.apk

  tauri-build:
    name: Build Desktop App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies
        run: npm install

      - name: Build Tauri Desktop App
        run: npx tauri build

      - name: Rename and Upload Desktop Artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName -Destination "GhostRunner-v1.101-Setup.exe"
          }
        continue-on-error: true

      - name: Upload Windows Installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ghost-runner-windows-installer
          path: |
            GhostRunner-v1.101-Setup.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Upload Desktop Artifact (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ghost-runner-macos-app
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app

  publish-release:
    name: Publish GitHub Release
    needs: [android-build, tauri-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: ghost-runner-android-apk
          path: release-assets/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: ghost-runner-windows-installer
          path: release-assets/
        continue-on-error: true

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ghost-runner-macos-app
          path: release-assets/
        continue-on-error: true

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_name }}"
          if [[ "$TAG_NAME" != v* ]]; then
            TAG_NAME="v1.101"
          fi
          echo "Publishing release $TAG_NAME..."
          gh release create "$TAG_NAME" release-assets/* \
            --title "Ghost Runner Release $TAG_NAME" \
            --notes-file CHANGELOG.md \
            --draft=false || echo "Release published."
